apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: novagpt-backend-hpa
  namespace: novagpt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: novagpt-backend

  minReplicas: 2
  maxReplicas: 5

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70