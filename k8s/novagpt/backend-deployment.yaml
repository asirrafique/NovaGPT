apiVersion: apps/v1
kind: Deployment
metadata:
  name: novagpt-backend
  namespace: novagpt

spec:
  replicas: 3

  selector:
    matchLabels:
      app: novagpt-backend

  template:
    metadata:
      labels:
        app: novagpt-backend

    spec:
      containers:
        - name: backend
          image: novagpt-backend:health
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5

          envFrom:
            - secretRef:
                name: novagpt-secrets

            - configMapRef:
                name: novagpt-backend-config