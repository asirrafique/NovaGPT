name: NovaGPT CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: docker build -t novagpt-backend:ci .


  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL=https://novagpt-backend-mkz9.onrender.com \
            -t novagpt-frontend:ci .

  security:
    name: Docker Security Scan
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t novagpt-backend:scan ./Backend

      - name: Build frontend image
        run: |
          docker build \
            --build-arg VITE_BACKEND_URL=https://novagpt-backend-mkz9.onrender.com \
            -t novagpt-frontend:scan ./Frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novagpt-backend:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novagpt-frontend:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH


   deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest

    needs:
      - security

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy backend to Render
        run: curl -fsS -X POST "${{https://api.render.com/deploy/srv-d9nl1bajnfac73baaa3g?key=iEfjuNbD7h0}}"

      - name: Deploy frontend to Render
        run: curl -fsS -X POST "${{https://api.render.com/deploy/srv-d9nldru1egvs738asi90?key=-AaQEhyRF_0}}"
